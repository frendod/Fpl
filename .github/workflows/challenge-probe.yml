# .github/workflows/challenge-probe.yml — probe-2026-09-11a
#
# One-off: opens the FPL Challenge site headless, records the data feeds it
# loads, and commits probe/challenge.json so the findings can be read from
# GitHub. Run it from Actions → Challenge probe → Run workflow, pasting the
# Challenge page URL (or several, comma-separated).
#
# Shares the snapshot jobs' concurrency group so its commit can never race
# theirs. Safe to delete once the feed is understood.

name: Challenge probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Challenge page URL(s), comma-separated'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fpl-snapshot
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Probe
        env:
          URLS: ${{ inputs.urls }}
        run: |
          node probe-challenge.mjs "$URLS"
          cat probe-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit findings
        run: |
          if [ -z "$(git status --porcelain -- probe)" ]; then
            echo "nothing captured"
            exit 0
          fi
          git config user.name  "challenge-probe[bot]"
          git config user.email "actions@github.com"
          git add probe
          git commit -m "probe: challenge feed"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
