<!DOCTYPE html>
<html lang="en" data-build="targets-2026-10-02d">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10151c">
<meta name="build" content="targets-2026-10-02d">
<title>Fixture Targets — FPL Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* targets-2026-10-02d — companion to index.html, same token system as gw-odds.html */
:root{
  --ink:#10151c; --panel:#171d26; --panel2:#1e2530;
  --line:rgba(232,228,220,.10); --line2:rgba(232,228,220,.18);
  --paper:#ffffff; --dim:#ffffff; --dimmer:#ffffff;
  --good:#4ec9a0; --bad:#e5657a; --accent:#d9a441; --accent-soft:rgba(217,164,65,.14);
  --d1:#0f6b3f; --d2:#2f8f5b; --d3:#4a5361; --d4:#a33a3f; --d5:#6e1a28;
}
.light-theme{
  --ink:#ffffff; --panel:#f5f5f5; --panel2:#eaeaea;
  --line:rgba(0,0,0,.12); --line2:rgba(0,0,0,.22);
  --paper:#000000; --dim:#000000; --dimmer:#000000;
  --good:#1d7c5c; --bad:#c92f2f; --accent:#9a6a12; --accent-soft:rgba(217,164,65,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--paper);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;min-height:100vh;overscroll-behavior-y:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(180deg,transparent 0 39px,rgba(232,228,220,.022) 39px 40px)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 40px calc(16px + env(safe-area-inset-left))}

.masthead{margin-bottom:6px}
.masthead-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.langtoggle,.themtoggle{display:flex;gap:2px;flex-shrink:0;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.langbtn,.themebtn{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;padding:4px 9px;cursor:pointer;border:none;background:transparent;color:var(--dim)}
.langbtn[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--dim)}
h1{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(34px,7vw,54px);font-weight:400;line-height:1;margin-top:6px}
h1 em{font-style:italic;color:var(--accent)}
img.ball{display:inline-block}
.subline{margin-top:6px;font-size:13.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tab{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:2px;border:1px solid var(--line2);background:transparent;color:var(--dim);text-decoration:none;display:inline-block;line-height:normal}
.tab:hover{color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
@media (hover:none) and (pointer:coarse){ .tab{padding:14px 18px} }

.controls{margin-top:18px;display:flex;gap:16px 26px;flex-wrap:wrap;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.ctl label,.ctl .lbl{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.ctl .val{color:var(--accent);font-weight:600}
select{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 10px;border:1px solid var(--line2);border-radius:3px;background:var(--panel2);color:var(--paper);cursor:pointer;min-width:150px}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;padding:8px 14px;border:none;background:transparent;color:var(--paper);cursor:pointer}
.seg button[aria-pressed=true]{background:#d9a441;color:#000}
.hint{font-size:12.5px;flex-basis:100%}
th .odds{display:block;font-size:9.5px;letter-spacing:.04em;font-weight:400;margin-top:3px}
.chip.mkt{box-shadow:inset 0 -3px 0 rgba(255,255,255,.85)}
.warnbox{margin-top:12px;font-size:12.5px;padding:8px 12px;border:1px solid var(--bad);border-radius:4px}

.legend{display:flex;gap:6px;align-items:center;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;flex-wrap:wrap}
.legend .sw{width:26px;height:14px;border-radius:2px;display:inline-block}

.tablewrap{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:max-content}
th{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;font-weight:600;text-align:center;padding:10px 4px;border-bottom:1px solid var(--line2);white-space:nowrap}
th.l{text-align:left;padding-left:12px}
td{padding:4px 3px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.sticky{position:sticky;left:0;background:var(--panel);z-index:1}
td.rk{font-family:'IBM Plex Mono',monospace;font-size:11px;width:30px}
td.tm{text-align:left;padding-left:10px;font-weight:600;white-space:nowrap}
td.tm .full{font-weight:400;font-size:12px;margin-left:6px}
td.ease{font-family:'IBM Plex Mono',monospace;font-weight:600;min-width:92px;padding:0 10px}
.bar{height:4px;border-radius:2px;background:var(--line2);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#d9a441}
.cell{display:flex;flex-direction:column;gap:2px;min-width:62px}
.chip{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:#fff;border-radius:3px;padding:6px 4px;line-height:1.1;white-space:nowrap}
.chip small{font-weight:400;font-size:9.5px;margin-left:3px}
.chip.blank{background:transparent;color:var(--paper);border:1px dashed var(--line2);font-weight:400}
tr.team:hover td,tr.team:hover td.sticky{background:var(--panel2)}
tr.pl td{border-bottom:1px solid var(--line2);padding:0 0 10px}
.picks{display:flex;gap:8px;flex-wrap:wrap;padding:2px 12px 0 40px;position:sticky;left:0;max-width:min(100%,calc(100vw - 34px))}
.pk{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;display:flex;gap:10px;align-items:baseline;font-size:13px}
.pk b{font-weight:600}
.pk .pos,.pk .meta{font-family:'IBM Plex Mono',monospace;font-size:11px}
.pk .pos{font-size:10px}
.pk .xp{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--accent)}
.pk .warn{color:var(--bad);font-weight:600}
.pk.none{font-size:12px}

.state{margin-top:40px;text-align:center;font-size:14px}
.state .mono{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:8px}
.retry{margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;padding:9px 18px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:3px;cursor:pointer}

.notes{margin-top:22px;font-size:13px;line-height:1.6;max-width:820px}
.notes h3{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;margin-bottom:6px;color:var(--accent);font-weight:600}
.notes p{margin-bottom:8px}
footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.7}
@media (max-width:640px){
  td.tm .full{display:none}
  .picks{padding-left:10px;flex-direction:column;gap:5px}
  /* Fixed columns so position, price, minutes and xP line up whatever the name length. */
  .pk{display:grid;grid-template-columns:minmax(0,1fr) 2.6em 3.7em 2.7em 4.9em;gap:0 6px;align-items:baseline}
  .pk b{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pk .pos{text-align:center}
  .pk .meta,.pk .xp{text-align:right;white-space:nowrap}
  .pk.none{display:block}
  td.ease{min-width:60px;padding:0 6px}
  .cell{min-width:54px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="masthead-row">
      <div class="eyebrow"><span id="seasonLbl">—</span> · <span id="buildStamp">—</span></div>
      <div style="display:flex;gap:12px;align-items:center">
        <div class="themtoggle" role="group" aria-label="Theme">
          <button class="themebtn" id="themeBtn" data-i18n="lightMode">Light mode</button>
        </div>
        <div class="langtoggle" role="group" aria-label="Language">
          <button class="langbtn" data-lang="en" aria-pressed="true">EN</button>
          <button class="langbtn" data-lang="es" aria-pressed="false">ES</button>
        </div>
      </div>
    </div>
    <h1><span class="ball" id="ball">⚽</span> <span data-i18n="titleA">Fixture</span> <em data-i18n="titleB">targets</em></h1>
    <div class="subline" id="subline" data-i18n="loading">Loading fixtures…</div>
    <nav class="tabs" role="tablist" data-page="targets"></nav>
    <script src="nav.js"></script>
  </div>

  <div class="controls" id="controls" style="display:none">
    <div class="ctl">
      <label for="n"><span data-i18n="window">Window</span> · <span class="val" id="nVal"></span></label>
      <select id="n"></select>
    </div>
    <div class="ctl">
      <span class="lbl" data-i18n="rateFor">Rate fixtures for</span>
      <div class="seg" id="mode">
        <button data-m="all" aria-pressed="true" data-i18n="overall">Overall</button>
        <button data-m="att" aria-pressed="false" data-i18n="attackers">Attackers</button>
        <button data-m="def" aria-pressed="false" data-i18n="defenders">Defenders</button>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl" data-i18n="players">Players</span>
      <div class="seg" id="showPl">
        <button data-v="1" aria-pressed="true" data-i18n="showTop3">Show top 3</button>
        <button data-v="0" aria-pressed="false" data-i18n="hide">Hide</button>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl" data-i18n="gwOdds">Include GW odds</span>
      <div class="seg" id="useOdds">
        <button data-v="1" aria-pressed="false" data-i18n="on">On</button>
        <button data-v="0" aria-pressed="true" data-i18n="off">Off</button>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="warnbox" id="modelWarn" style="display:none"></div>

  <div class="legend" id="legend"></div>
  <div id="content"><div class="state" data-i18n="loading">Loading fixtures…</div></div>

  <div class="notes" id="notes" style="display:none">
    <h3 data-i18n="howH">HOW IT'S RATED</h3>
    <p id="how1"></p>
    <p id="how2"></p>
    <p id="how3"></p>
    <p id="how4"></p>
  </div>
  <footer id="footer" style="display:none"></footer>
</div>

<script>
const TARGETS_BUILD = 'targets-2026-10-02d';

/* ══ WHAT THIS PAGE DOES ════════════════════════════════
   One row per club, the next N gameweeks (1–10), easiest first.

   Difficulty of one fixture = ½ FPL's FDR + ½ the model's view of it.
   The model half comes from model/xp-engine.js's team ratings — the same
   attack/defence ratings xP uses, rebuilt here exactly as index.html's XPD
   does (priors + every settled post/gw-N snapshot):
     Attackers  goals the club is expected to score in that fixture
     Defenders  goals the club is expected to concede
     Overall    (default) the mean of the Attackers and Defenders difficulty
   It is put on FPL's 1–5 scale by matching the mean and spread of FPL's FDRs
   over the same fixtures, so both halves weigh the same.

   Ranking: Avg ease = Σ(6 − difficulty) over every fixture in the window ÷ N.
   A blank adds 0 (drags a club down); a double adds both (lifts it).

   Top 3: summed xP over the same window, straight from the engine —
   any position for Overall, MID/FWD for Attackers, GKP/DEF for Defenders.

   GW odds (toggle, off by default): where a bookmaker capture exists in
   history/odds/<season>/pre/ (late → adhoc → early → preview), the model
   half for that fixture uses the market's expected goals instead — λ from
   the devigged Correct Score book, same maths as gw-odds.html. Fixtures
   without odds keep the xG model. Column headers say Odds ✅ / ❌ per GW.
   The xP for the top 3 is not touched by the toggle.

   If the engine or priors cannot load, the page falls back to FPL's FDR
   alone and hides the players, saying so.
════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const POSN = {1:'GKP',2:'DEF',3:'MID',4:'FWD'};
const MAX_N = 10;

/* ── I18N ──────────────────────────────────────────────── */
const I18N = {
  en: {
    lightMode:'Light mode', darkMode:'Dark mode',
    titleA:'Fixture', titleB:'targets',
    loading:'Loading fixtures…',
    couldntReach:"Couldn't reach the app's data.", retry:'RETRY',
    window:'Window', rateFor:'Rate fixtures for', overall:'Overall', attackers:'Attackers', defenders:'Defenders',
    players:'Players', showTop3:'Show top 3', hide:'Hide',
    gwOdds:'Include GW odds', on:'On', off:'Off', oddsWord:'Odds',
    oddsPart:(k,n)=>`odds for ${k} of ${n} fixtures`,
    oddsTip:(lf,la,pt)=>` · market goals for ${lf} / against ${la} (${pt} capture)`,
    how4:"<b>Include GW odds</b>: when on, any fixture with a bookmaker capture uses the market's expected goals (devigged Correct Score) for the model half instead of the xG ratings. Odds usually only exist for the next gameweek or two, so the column headers show <b>Odds ✅</b> where they're used and <b>Odds ❌</b> where the xG model stands in. Chips priced from odds have a white underline. Top 3 xP is unchanged.",
    gwWord:'GW', weeks:n=>n+(n===1?' gameweek':' gameweeks'),
    subline:(n,m)=>`Next <b>${n}</b> gameweek${n>1?'s':''}, easiest first · rated for <b>${m==='all'?'attack and defence':m==='att'?'attackers':'defenders'}</b>`,
    hintAll:'Overall: attack and defence averaged — the best all-round fixtures. Top 3 shows any position.',
    hintAtt:'Attackers: how many goals each club should score. Top 3 shows MID/FWD.',
    hintDef:'Defenders: how few goals each club should concede. Top 3 shows GKP/DEF.',
    lvl:['','Very easy','Easy','Medium','Hard','Very hard'],
    team:'TEAM', avgEase:'AVG EASE', xpWord:'xP', noPlayers:'No eligible players',
    modelOff:e=>`The xP model couldn't load (${e}), so this is ranked on FPL's FDR alone and players are hidden.`,
    cellTitle:(a,b,d,f,lf,la,mk)=>`${a} v ${b} · difficulty ${d} · FDR ${f}`+(mk?'':(lf!=null?` · model goals for ${lf} / against ${la}`:'')),
    howH:"HOW IT'S RATED",
    how1:"Each fixture's difficulty is half FPL's official FDR and half the model's team ratings (the same attack/defence ratings the xP engine uses, fitted on xG). <b>Attackers</b> rates a fixture by how many goals the club is expected to score; <b>Defenders</b> by how many it's expected to concede. <b>Overall</b> (the default) is the average of the two. The model half is rescaled to FPL's 1–5 spread (same average and spread) so the two halves weigh the same.",
    how2:"<b>Avg ease</b> = sum of (6 − difficulty) for every fixture in the window ÷ number of gameweeks. A blank adds 0, so it drags a club down; a double adds both, so it lifts them. Higher is better.",
    how3:"<b>Top 3</b> = the three highest summed xP over the same window: any position in Overall, MID/FWD in Attackers, GKP/DEF in Defenders. Price and expected minutes alongside; minutes in red when under 60 or the player is flagged.",
    footer:(eng,gws)=>`${TARGETS_BUILD} · engine ${eng} · ratings from ${gws} settled gameweek${gws===1?'':'s'} + last season · FPL data via /api/fpl`,
  },
  es: {
    lightMode:'Modo claro', darkMode:'Modo oscuro',
    titleA:'Objetivos', titleB:'por calendario',
    loading:'Cargando partidos…',
    couldntReach:'No se pudieron obtener los datos de la app.', retry:'REINTENTAR',
    window:'Periodo', rateFor:'Valorar partidos para', overall:'General', attackers:'Atacantes', defenders:'Defensas',
    players:'Jugadores', showTop3:'Ver top 3', hide:'Ocultar',
    gwWord:'J', weeks:n=>n+(n===1?' jornada':' jornadas'),
    subline:(n,m)=>`Próximas <b>${n}</b> jornada${n>1?'s':''}, de más fácil a más difícil · valorado para <b>${m==='all'?'ataque y defensa':m==='att'?'atacantes':'defensas'}</b>`,
    hintAll:'General: media de ataque y defensa — los mejores partidos en conjunto. El top 3 muestra cualquier posición.',
    hintAtt:'Atacantes: cuántos goles debería marcar cada club. El top 3 muestra MED/DEL.',
    hintDef:'Defensas: cuán pocos goles debería encajar cada club. El top 3 muestra POR/DEF.',
    lvl:['','Muy fácil','Fácil','Media','Difícil','Muy difícil'],
    team:'EQUIPO', avgEase:'FACILIDAD MEDIA', xpWord:'xP', noPlayers:'Sin jugadores elegibles',
    modelOff:e=>`El modelo xP no se pudo cargar (${e}); la clasificación usa solo el FDR de FPL y los jugadores se ocultan.`,
    cellTitle:(a,b,d,f,lf,la,mk)=>`${a} v ${b} · dificultad ${d} · FDR ${f}`+(mk?'':(lf!=null?` · goles del modelo a favor ${lf} / en contra ${la}`:'')),
    gwOdds:'Incluir cuotas de la jornada', on:'Sí', off:'No', oddsWord:'Cuotas',
    oddsPart:(k,n)=>`cuotas para ${k} de ${n} partidos`,
    oddsTip:(lf,la,pt)=>` · goles del mercado a favor ${lf} / en contra ${la} (captura ${pt})`,
    how4:'<b>Incluir cuotas de la jornada</b>: si está activado, cada partido con captura de casas de apuestas usa los goles esperados del mercado (marcador exacto sin margen) para la mitad del modelo en lugar de las valoraciones xG. Normalmente solo hay cuotas para la próxima jornada o dos, así que las cabeceras muestran <b>Cuotas ✅</b> donde se usan y <b>Cuotas ❌</b> donde se usa el modelo xG. Las fichas con cuotas llevan un subrayado blanco. El xP del top 3 no cambia.',
    howH:'CÓMO SE VALORA',
    how1:'La dificultad de cada partido es mitad el FDR oficial de FPL y mitad las valoraciones de equipo del modelo (las mismas de ataque/defensa que usa el motor xP, ajustadas con xG). <b>Atacantes</b> valora un partido por los goles que se espera que marque el club; <b>Defensas</b> por los que se espera que encaje. <b>General</b> (por defecto) es la media de ambos. La mitad del modelo se reescala a la escala 1–5 de FPL (misma media y dispersión) para que ambas mitades pesen igual.',
    how2:'<b>Facilidad media</b> = suma de (6 − dificultad) de cada partido del periodo ÷ número de jornadas. Una jornada sin partido suma 0 y hunde al club; una doble suma ambos y lo sube. Más alto es mejor.',
    how3:'<b>Top 3</b> = los tres xP sumados más altos del mismo periodo: cualquier posición en General, MED/DEL en Atacantes, POR/DEF en Defensas. Precio y minutos esperados al lado; minutos en rojo si son menos de 60 o el jugador tiene aviso.',
    footer:(eng,gws)=>`${TARGETS_BUILD} · motor ${eng} · valoraciones de ${gws} jornada${gws===1?'':'s'} cerrada${gws===1?'':'s'} + temporada anterior · datos de FPL vía /api/fpl`,
  },
};
const POS_ES = {GKP:'POR',DEF:'DEF',MID:'MED',FWD:'DEL'};
let LANG = (function(){ try{ return localStorage.getItem('fplLang') || 'en'; }catch(e){ return 'en'; } })();
if (!I18N[LANG]) LANG = 'en';
function t(key){ const v = I18N[LANG][key]; return v !== undefined ? v : I18N.en[key]; }
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n); if (typeof v === 'string') el.textContent = v;
  });
  document.title = t('titleA') + ' ' + t('titleB') + ' — FPL Model';
  applyTheme(document.documentElement.classList.contains('light-theme'));
}
function setLang(l){
  LANG = l;
  try{ localStorage.setItem('fplLang', l); }catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll('.langbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  applyStaticI18n();
  if (DATA) { fillWindowSelect(); render(); }
}
document.querySelectorAll('.langbtn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

/* ── THEME (shared key with index.html) ──────────────────── */
const THEME_KEY = 'fplTheme';
function applyTheme(light){
  document.documentElement.classList.toggle('light-theme', !!light);
  $('themeBtn').textContent = light ? t('darkMode') : t('lightMode');
}
(function(){ let s=null; try{ s=localStorage.getItem(THEME_KEY); }catch(e){} applyTheme(s==='light'); })();
$('themeBtn').addEventListener('click', () => {
  const l = !document.documentElement.classList.contains('light-theme');
  applyTheme(l); try{ localStorage.setItem(THEME_KEY, l ? 'light' : 'dark'); }catch(e){}
});

/* ── BALL ──────────────────────────────────────────────────
   The same ⚽ emoji as the other pages, drawn by the device's own emoji font,
   with its dark patches turned blue. Only dark pixels are recoloured, keeping
   their shading; the white panels and their grey shading are untouched. If
   canvas is unavailable the plain emoji stays. */
(function(){
  try{
    const span=$('ball'), px=128, pad=24, c=document.createElement('canvas');
    c.width=c.height=px+pad*2;
    const g=c.getContext('2d',{willReadFrequently:true});
    g.font=px+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText('⚽',c.width/2,c.height/2);
    const d=g.getImageData(0,0,c.width,c.height), a=d.data, B=[31,95,191];
    let x0=c.width,y0=c.height,x1=-1,y1=-1;
    for(let i=0;i<a.length;i+=4){
      if(!a[i+3])continue;
      const L=.299*a[i]+.587*a[i+1]+.114*a[i+2];
      const w=L>=150?0:L<=95?1:(150-L)/55;
      if(w) for(let k=0;k<3;k++){ const blue=Math.min(255,B[k]*(.7+L/170)); a[i+k]=a[i+k]*(1-w)+blue*w; }
      const x=(i/4)%c.width, y=(i/4)/c.width|0;
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
    if(x1<0)return;
    g.putImageData(d,0,0);
    const w=x1-x0+1, h=y1-y0+1, o=document.createElement('canvas'); o.width=w; o.height=h;
    o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h);
    const img=new Image(); img.src=o.toDataURL(); img.className='ball'; img.alt='⚽';
    const em=h/px; img.style.height=em+'em'; img.style.width=(w/px)+'em';
    img.style.verticalAlign=(-(em-0.7)/2).toFixed(3)+'em';
    span.replaceWith(img);
  }catch(e){}
})();

/* ── DATA ──────────────────────────────────────────────── */
function currentSeason(d){
  d = d || new Date();
  const y = d.getUTCFullYear(), start = d.getUTCMonth() >= 6 ? y : y - 1;
  return start + '-' + String((start + 1) % 100).padStart(2, '0');
}
async function getJSON(url, opts){
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(url + ' — ' + r.status);
  return r.json();
}
async function getJSONorNull(url){ try{ return await getJSON(url, { cache:'force-cache' }); }catch(e){ return null; } }
function loadEngine(){
  if (typeof XPE !== 'undefined') return Promise.resolve(true);
  return new Promise(res => {
    const s = document.createElement('script');
    s.src = './model/xp-engine.js?b=' + TARGETS_BUILD;
    s.onload = () => res(typeof XPE !== 'undefined');
    s.onerror = () => res(false);
    document.head.appendChild(s);
  });
}

/* Team ratings and per-player inputs, assembled exactly as index.html's
   XPD.ensure() does, so the numbers here match the app's xP. */
async function buildModel(boot, next, season){
  if (!(await loadEngine())) throw new Error('model/xp-engine.js did not load');
  const gws = []; for (let g = 1; g < next; g++) gws.push(g);
  const [pri, ...posts] = await Promise.all([
    getJSONorNull('./history/fpl/priors/' + season + '.json'),
    ...gws.map(g => getJSONorNull('./history/fpl/' + season + '/post/gw-' + g + '.json')),
  ]);
  if (!pri || !pri.pl) throw new Error('no priors file for ' + season);
  const rules = XPE.rulesFor(season);
  const teamCode = Object.fromEntries(boot.teams.map(t => [t.id, t.code]));
  const byId = Object.fromEntries(boot.elements.map(e => [e.id, e]));
  const me = {}, fxXG = {}, matches = []; let aThis = 0, xaThis = 0, loaded = 0;
  const blank = () => ({ mins:0, xg:0, xa:0, bn:0, yc:0, sv:0, dc:0, dcMins:0, dcSt:0, dcHit:0, win:[] });
  posts.forEach(j => {
    if (!j || !j.players) return;
    loaded++;
    const fxById = Object.fromEntries((j.fixtures || []).map(f => [f.id, f]));
    for (const id in j.players){
      const p = j.players[id], legs = p.fixtures || [], n = legs.length;
      if (!n) continue;
      const el = byId[id], pos = el ? POSN[el.element_type] : null;
      const m = me[id] || (me[id] = blank());
      const mins = +p.minutes || 0, st = +p.starts || 0, xg = +p.expected_goals || 0, xa = +p.expected_assists || 0, dc = +p.defensive_contribution || 0;
      m.mins += mins; m.xg += xg; m.xa += xa; m.bn += +p.bonus || 0; m.yc += +p.yellow_cards || 0; m.sv += +p.saves || 0;
      m.dc += dc; m.dcMins += mins; m.dcSt += st;
      if (pos && dc / n >= (XPE.DCTHR[pos] ?? Infinity)) m.dcHit += n;
      for (let k = 0; k < n; k++) m.win.push({ minutes: mins / n, starts: st > k ? 1 : 0 });
      aThis += +p.assists || 0; xaThis += xa;
      for (const L of legs){
        const f = fxById[L.fixture]; if (!f) continue;
        const team = L.venue === 'H' ? f.team_h : f.team_a;
        const key = f.id + ':' + team; fxXG[key] = (fxXG[key] || 0) + xg / n;
      }
    }
    for (const f of (j.fixtures || [])){
      const h = fxXG[f.id + ':' + f.team_h], a = fxXG[f.id + ':' + f.team_a];
      if (f.finished && h != null && a != null)
        matches.push({ home: teamCode[f.team_h], away: teamCode[f.team_a], hxg: h, axg: a });
    }
  });
  const team = { ...pri.team, att: { ...pri.team.att }, def: { ...pri.team.def } };
  for (const tm of boot.teams) if (!(tm.code in team.att)) { team.att[tm.code] = pri.team.promoted.att; team.def[tm.code] = pri.team.promoted.def; }
  const T = XPE.teamRatings(matches, team, {});
  const assistRatio = (aThis + 60 * pri.assistRatio) / (xaThis + 60);
  return { XPE, pri, rules, teamCode, me, T, assistRatio, loaded, blank };
}

/* ── GW ODDS ─────────────────────────────────────────────────
   Bookmaker captures from the odds-snapshot bot. Read from raw GitHub, like
   gw-odds.html, because snapshot-only commits don't trigger a Netlify deploy.
   Per fixture we keep λ for each side from the devigged Correct Score book. */
const ODDS_RAW = 'https://raw.githubusercontent.com/frendod/Fpl/main/history/odds';
async function oddsFileFor(season, gw){
  for (const pt of ['late', 'adhoc', 'early', 'preview']){
    try{
      const r = await fetch(`${ODDS_RAW}/${season}/pre/gw-${gw}-${pt}.json`, { cache:'no-store' });
      if (r.ok) return { pt, j: await r.json() };
    }catch(e){}
  }
  return null;
}
function oddsLambdas(ev){
  const b = (ev && ev.bookmakers) || {};
  const book = b['Bet365'] || b['Unibet'] || b['Bet365 (no latency)'] || Object.values(b)[0] || [];
  const cs = book.find(m => m.name === 'Correct Score');
  if (!cs || !cs.odds || !cs.odds.length) return null;
  let tot = 0, h = 0, a = 0;
  for (const o of cs.odds){
    const [x, y] = String(o.label).split('-').map(Number), q = 1 / parseFloat(o.odds);
    if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(q)) continue;
    tot += q; h += q * x; a += q * y;
  }
  return tot ? { home: h / tot, away: a / tot } : null;
}
/* → { byFixture: {fplFixtureId: {home, away, pt}}, gwHas: {gw: count} } */
async function loadOdds(season, gws){
  const files = await Promise.all(gws.map(g => oddsFileFor(season, g)));
  const byFixture = {}, gwHas = {};
  files.forEach((f, i) => {
    gwHas[gws[i]] = 0;
    if (!f || !f.j || !f.j.mapping) return;
    for (const m of f.j.mapping){
      const L = oddsLambdas(f.j.odds && f.j.odds[String(m.oddsEvent)]);
      if (L && m.fplFixture != null){ byFixture[m.fplFixture] = { ...L, pt: f.pt }; gwHas[gws[i]]++; }
    }
  });
  return { byFixture, gwHas };
}

/* ── BUILD THE TABLE DATA ────────────────────────────────── */
let DATA = null, N = 5, MODE = 'all', SHOWPL = true, USEODDS = false, ODDS = null;

function prepare(boot, fixtures, next, M){
  const gws = []; for (let g = next; g < next + MAX_N && g <= 38; g++) gws.push(g);
  const fx = fixtures.filter(f => f.event != null && f.event >= next && f.event < next + MAX_N);
  const teams = boot.teams.map(t => ({ id:t.id, short:t.short_name, name:t.name }));

  /* One entry per club per fixture. */
  const sides = [];
  for (const f of fx){
    let lh = null, la = null;
    if (M){ const L = M.XPE.lambdas(M.T, M.teamCode[f.team_h], M.teamCode[f.team_a]); lh = L.home; la = L.away; }
    sides.push({ fx:f.id, gw:f.event, team:f.team_h, opp:f.team_a, home:true,  fdr:f.team_h_difficulty, mlf:lh, mla:la });
    sides.push({ fx:f.id, gw:f.event, team:f.team_a, opp:f.team_h, home:false, fdr:f.team_a_difficulty, mlf:la, mla:lh });
  }
  blend(sides, false);

  /* Players: summed xP per gameweek over the window, from the engine. */
  const players = [];
  if (M){
    for (const el of boot.elements){
      const pos = POSN[el.element_type]; if (!pos) continue;
      const price = (el.now_cost || 0) / 10;
      const inp = M.XPE.playerInputs(pos, price, M.me[el.id] || M.blank(), M.pri.pl[el.code] || null, M.pri, M.rules, {}, null);
      const a0 = M.XPE.availability(el.status, el.chance_of_playing_next_round, 0);
      const xp = gws.map(gw => {
        const a = M.XPE.availability(el.status, el.chance_of_playing_next_round, Math.max(0, gw - next));
        const mins = M.XPE.scaleMinutes(inp.mins, a);
        let s = 0;
        for (const f of fx) if (f.event === gw && (f.team_h === el.team || f.team_a === el.team)){
          const isH = f.team_h === el.team;
          const ctx = M.XPE.fixtureContext(M.T, M.rules, M.teamCode[f.team_h], M.teamCode[f.team_a], isH, M.assistRatio);
          s += M.XPE.fixtureXP({ pos, rates: inp.rates, mins }, ctx).total;
        }
        return s;
      });
      players.push({ n:el.web_name, t:el.team, p:pos, c:price, st:el.status, xm:Math.round(M.XPE.scaleMinutes(inp.mins, a0).xMins), xp });
    }
  }
  return { gws, teams, sides, players, model: !!M };
}

/* Blend. Model half standardised onto FPL's FDR mean/spread over the same
   fixtures (all ten gameweeks, so a club's colours don't shift with N).
   With odds on, a fixture's λ comes from the market where a capture exists,
   else from the xG model; both are goals, so they share one standardisation.
   A fixture with neither (model failed, no odds) is FDR alone. */
function blend(sides, useOdds){
  if (!sides.length) return;
  const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
  const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v-m)**2))); };
  sides.forEach(s => {
    const o = useOdds && ODDS && ODDS.byFixture[s.fx];
    s.mkt = o ? o.pt : null;
    if (o){ s.lf = s.home ? o.home : o.away; s.la = s.home ? o.away : o.home; }
    else { s.lf = s.mlf; s.la = s.mla; }
  });
  const fM = mean(sides.map(s=>s.fdr)), fS = sd(sides.map(s=>s.fdr)) || 1;
  const have = sides.filter(s => s.lf != null);
  const onFdr = (key, sign) => {
    if (!have.length) return;
    const vals = have.map(s => sign * s[key]), m = mean(vals), d = sd(vals) || 1;
    have.forEach((s,i) => { s['m_' + key] = Math.min(5, Math.max(1, fM + fS*(vals[i]-m)/d)); });
  };
  onFdr('lf', -1); onFdr('la', 1);
  sides.forEach(s => {
    s.diff = s.lf != null ? { att:.5*s.fdr+.5*s.m_lf, def:.5*s.fdr+.5*s.m_la } : { att:s.fdr, def:s.fdr };
    s.diff.all = (s.diff.att + s.diff.def) / 2;   // Overall: attack and defence weighted equally
  });
}

/* ── RENDER ────────────────────────────────────────────── */
const band = d => d < 1.9 ? 1 : d < 2.6 ? 2 : d < 3.4 ? 3 : d < 4.1 ? 4 : 5;
const COL = ['', 'var(--d1)', 'var(--d2)', 'var(--d3)', 'var(--d4)', 'var(--d5)'];
const posLbl = p => LANG === 'es' ? POS_ES[p] : p;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fillWindowSelect(){
  const sel = $('n'), max = DATA.gws.length;
  N = Math.min(N, max);
  sel.innerHTML = Array.from({length:max}, (_,i) => i+1)
    .map(i => `<option value="${i}"${i===N?' selected':''}>${t('weeks')(i)}</option>`).join('');
}

function render(){
  const D = DATA, win = D.gws.slice(0, N), G = t('gwWord');
  const TEAM = Object.fromEntries(D.teams.map(x => [x.id, x]));
  $('nVal').textContent = N === 1 ? `${G}${win[0]}` : `${G}${win[0]}–${G}${win[win.length-1]}`;
  $('subline').innerHTML = t('subline')(N, MODE);
  $('hint').textContent = t(MODE === 'all' ? 'hintAll' : MODE === 'att' ? 'hintAtt' : 'hintDef');
  $('legend').innerHTML = [1,2,3,4,5].map(b => `<span class="sw" style="background:${COL[b]}"></span><span>${t('lvl')[b]}</span>`).join('&nbsp;&nbsp;');
  $('how1').innerHTML = t('how1'); $('how2').innerHTML = t('how2'); $('how3').innerHTML = t('how3'); $('how4').innerHTML = t('how4');
  const nFx = gw => D.sides.filter(s => s.gw === gw).length / 2;
  const gwHead = gw => {
    if (!USEODDS) return `${G}${gw}`;
    const k = ODDS ? (ODDS.gwHas[gw] || 0) : 0, n = nFx(gw);
    const tip = k && k < n ? ` title="${esc(t('oddsPart')(k, n))}"` : '';
    return `${G}${gw}<span class="odds"${tip}>${t('oddsWord')} ${k ? '✅' : '❌'}</span>`;
  };

  const posOK = MODE === 'all' ? ['GKP','DEF','MID','FWD'] : MODE === 'att' ? ['MID','FWD'] : ['GKP','DEF'];
  const rows = D.teams.map(tm => {
    const cells = win.map(gw => D.sides.filter(s => s.team === tm.id && s.gw === gw));
    const ease = cells.flat().reduce((a,s) => a + (6 - s.diff[MODE]), 0) / N;
    const top = D.players.filter(p => p.t === tm.id && posOK.includes(p.p))
      .map(p => ({ ...p, sum: p.xp.slice(0, N).reduce((a,b) => a+b, 0) }))
      .sort((a,b) => b.sum - a.sum).slice(0, 3);
    return { tm, cells, ease, top };
  }).sort((a,b) => b.ease - a.ease || a.tm.short.localeCompare(b.tm.short));

  const showPl = SHOWPL && D.model, cols = 3 + N;
  let h = `<div class="tablewrap"><table><thead><tr><th class="sticky">#</th><th class="l sticky" style="left:30px">${t('team')}</th><th>${t('avgEase')}</th>${win.map(g => `<th>${gwHead(g)}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach((r, i) => {
    h += `<tr class="team"><td class="rk sticky">${i+1}</td><td class="tm sticky" style="left:30px">${esc(r.tm.short)}<span class="full">${esc(r.tm.name)}</span></td>
      <td class="ease">${r.ease.toFixed(2)}<div class="bar"><i style="width:${Math.max(0, Math.min(100, (r.ease-1)/4*100))}%"></i></div></td>`;
    for (const c of r.cells){
      if (!c.length){ h += `<td><div class="cell"><span class="chip blank">–</span></div></td>`; continue; }
      h += `<td><div class="cell">${c.map(s => {
        const d = s.diff[MODE], o = TEAM[s.opp];
        const tip = t('cellTitle')(TEAM[s.team].short, o.short, d.toFixed(2), s.fdr, s.lf != null ? s.lf.toFixed(2) : null, s.la != null ? s.la.toFixed(2) : null, s.mkt)
          + (s.mkt ? t('oddsTip')(s.lf.toFixed(2), s.la.toFixed(2), s.mkt) : '');
        return `<span class="chip${s.mkt ? ' mkt' : ''}" style="background:${COL[band(d)]}" title="${esc(tip)}">${esc(o.short)}<small>${s.home ? 'H' : 'A'}</small></span>`;
      }).join('')}</div></td>`;
    }
    h += '</tr>';
    if (showPl){
      h += `<tr class="pl"><td colspan="${cols}"><div class="picks">${r.top.length ? r.top.map(p => {
        const risky = p.xm < 60 || p.st !== 'a';
        return `<div class="pk"><b>${esc(p.n)}</b><span class="pos">${posLbl(p.p)}</span><span class="meta">£${p.c.toFixed(1)}</span><span class="meta ${risky ? 'warn' : ''}">${p.xm}′</span><span class="xp">${p.sum.toFixed(1)} ${t('xpWord')}</span></div>`;
      }).join('') : `<div class="pk none">${t('noPlayers')}</div>`}</div></td></tr>`;
    }
  });
  $('content').innerHTML = h + '</tbody></table></div>';
}

$('n').addEventListener('change', e => { N = +e.target.value; render(); });
$('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; MODE = b.dataset.m; [...$('mode').children].forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); });
$('useOdds').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || !DATA) return;
  USEODDS = b.dataset.v === '1';
  [...$('useOdds').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  if (USEODDS && !ODDS){
    try{ ODDS = await loadOdds(DATA.season, DATA.gws); }catch(err){ ODDS = { byFixture:{}, gwHas:{} }; }
  }
  blend(DATA.sides, USEODDS); render();
});
$('showPl').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; SHOWPL = b.dataset.v === '1'; [...$('showPl').children].forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); });

/* ── LOAD ──────────────────────────────────────────────── */
async function load(){
  $('content').innerHTML = `<div class="state">${t('loading')}</div>`;
  try{
    const bundle = await getJSON('/api/fpl', { cache:'no-store' });
    const boot = bundle.bootstrap, fixtures = bundle.fixtures || [];
    if (!boot || !boot.teams || !boot.elements) throw new Error('bootstrap-static missing');
    const events = boot.events || [];
    const nx = events.find(e => e.is_next) || events.find(e => !e.finished);
    if (!nx) throw new Error('no upcoming gameweek');
    const season = currentSeason();
    $('seasonLbl').textContent = season.replace('-', '/');

    let M = null, err = null;
    try{ M = await buildModel(boot, nx.id, season); }catch(e){ err = String(e && e.message || e); console.warn('xP model unavailable:', err); }
    DATA = prepare(boot, fixtures, nx.id, M); DATA.season = season; ODDS = null;
    if (USEODDS){ ODDS = await loadOdds(season, DATA.gws); blend(DATA.sides, true); }
    if (!DATA.gws.length) throw new Error('no fixtures ahead');

    $('modelWarn').style.display = M ? 'none' : '';
    if (!M) $('modelWarn').textContent = t('modelOff')(err);
    $('controls').style.display = ''; $('notes').style.display = '';
    $('footer').style.display = '';
    $('footer').textContent = M ? t('footer')(M.XPE.STAMP || '—', M.loaded) : TARGETS_BUILD;
    fillWindowSelect();
    render();
  }catch(e){
    console.error(e);
    $('content').innerHTML = `<div class="state">${t('couldntReach')}<div class="mono">${esc(e && e.message || e)}</div><button class="retry" onclick="load()">${t('retry')}</button></div>`;
  }
}

$('buildStamp').textContent = TARGETS_BUILD;
try{ console.log('%cFixture Targets build: ' + TARGETS_BUILD, 'color:#d9a441;font-weight:bold'); }catch(e){}
document.documentElement.lang = LANG;
document.querySelectorAll('.langbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
applyStaticI18n();
load();
</script>
